name: Build and Push RunPod Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Радикальная очистка диска (освобождает до 50+ ГБ)
      - name: Maximize Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' 'azure-cli' 'google-chrome-stable' 'firefox' 'powershell' 'mono-devel' || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          sudo docker image prune --all --force || true
          df -h

      # 2. Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4

      # 3. Настраиваем buildx с ограничением по памяти, чтобы не выбивало OOM
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Логин в Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Сборка и пуш с отключением лишних attestations/provenance
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/minimax-h3-image:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/minimax-h3-image:latest
